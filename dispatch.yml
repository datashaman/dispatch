---
version: 1
agent:
  name: dispatch
  executor: laravel-ai
  instructions_file: AGENTS.md
  provider: anthropic
  model: claude-sonnet-4-6
cache:
  config: true
rules:
  -
    id: analyze
    event: issues.labeled
    prompt: |-
      You are triaging issue #{{ event.issue.number }} on the Dispatch project.

      Title: {{ event.issue.title }}
      Body:
      {{ event.issue.body }}

      Analyze the issue and produce a detailed plan. Consider:
      1. What files and components are likely involved
      2. What changes are needed
      3. Potential risks or edge cases
      4. A step-by-step implementation plan

      Write your analysis as a well-structured markdown document.
    name: 'Analyze Issue'
    filters:
      -
        field: event.label.name
        operator: equals
        value: dispatch
    output:
      github_comment: true
      github_reaction: eyes
    agent:
      model: claude-sonnet-4-6
      tools:
        - Read
        - Glob
        - Grep
        - Bash
  -
    id: implement
    event: issue_comment.created
    prompt: |-
      You are implementing the approved plan for issue #{{ event.issue.number }}.

      Issue title: {{ event.issue.title }}
      Issue body:
      {{ event.issue.body }}

      Trigger comment by {{ event.comment.user.login }}:
      {{ event.comment.body }}

      Read the issue and prior comments for the analysis and plan.
      Implement the changes, commit them, and create a pull request.
      Use `gh` CLI for GitHub operations (creating PRs, posting comments).
    name: 'Implement Plan'
    filters:
      -
        field: event.comment.body
        operator: contains
        value: '@dispatch implement'
    output:
      github_comment: true
      github_reaction: rocket
    agent:
      tools:
        - Read
        - Edit
        - Write
        - Bash
        - Glob
        - Grep
      isolation: true
  -
    id: interactive
    event: issue_comment.created
    prompt: |-
      You are responding to a question or comment on issue #{{ event.issue.number }}.

      Issue title: {{ event.issue.title }}
      Issue body:
      {{ event.issue.body }}

      Comment by {{ event.comment.user.login }}:
      {{ event.comment.body }}

      Respond helpfully. You can read the codebase to answer questions.
      Use `gh` CLI for any GitHub interactions.
    name: 'Interactive Q&A'
    filters:
      -
        field: event.comment.body
        operator: contains
        value: '@dispatch'
      -
        field: event.comment.body
        operator: not_contains
        value: '@dispatch implement'
    output:
      github_comment: true
    agent:
      tools:
        - Read
        - Glob
        - Grep
        - Bash
  -
    id: review
    event: pull_request_review_comment.created
    prompt: |-
      You are responding to a PR review comment on the Dispatch project.

      PR: #{{ event.pull_request.number }} — {{ event.pull_request.title }}

      Review comment by {{ event.comment.user.login }}:
      {{ event.comment.body }}

      File: {{ event.comment.path }}
      Diff hunk:
      {{ event.comment.diff_hunk }}

      Respond to the review feedback. You can read the codebase for context.
      Use `gh` CLI for any GitHub interactions.
    name: 'Code Review Responder'
    filters:
      -
        field: event.comment.body
        operator: contains
        value: '@dispatch'
    output:
      github_comment: true
    agent:
      tools:
        - Read
        - Glob
        - Grep
        - Bash
  -
    id: stitch-designer
    event: issues.labeled
    prompt: |-
      You are a UI designer agent for issue #{{ event.issue.number }}.

      Issue title: {{ event.issue.title }}
      Issue body:
      {{ event.issue.body }}

      Your job is to generate a UI design using Google Stitch.

      Steps:
      1. Read DESIGN.md from the repo root (if it exists) to understand the project's design system
      2. Craft a clear, specific UI prompt based on the issue description
      3. Run the Stitch bridge to generate the design:
         ```
         node tools/stitch/stitch-bridge.js generate \
           --project "$STITCH_PROJECT_ID" \
           --prompt "YOUR PROMPT HERE" \
           --vibe "$(cat DESIGN.md 2>/dev/null || echo '')" \
           --device DESKTOP
         ```
      4. Parse the JSON output to extract html and screenshot_url
      5. Output the design using these EXACT markers (the coding agent depends on them):

      <!-- STITCH_SCREENSHOT: {screenshot_url from JSON} -->

      <!-- STITCH_HTML_START -->
      {html from JSON}
      <!-- STITCH_HTML_END -->

      Include a brief description of the design decisions you made.
    name: 'Stitch UI Designer'
    filters:
      -
        field: event.label.name
        operator: equals
        value: stitch-design
    output:
      github_comment: true
      github_reaction: art
    agent:
      tools:
        - Read
        - Bash
  -
    id: stitch-implementer
    event: issues.labeled
    depends_on:
      - stitch-designer
    prompt: |-
      You are implementing the UI design for issue #{{ event.issue.number }}.

      Issue title: {{ event.issue.title }}
      Issue body:
      {{ event.issue.body }}

      The designer agent produced a Stitch-generated UI design.
      Their full output is below:

      {{ event.upstream_outputs.stitch-designer }}

      Steps:
      1. Extract the HTML between <!-- STITCH_HTML_START --> and <!-- STITCH_HTML_END --> markers
      2. Extract the screenshot URL from <!-- STITCH_SCREENSHOT: URL --> marker
      3. Read DESIGN.md to understand the project's Tailwind classes and component patterns
      4. Translate the Stitch HTML into Blade/Livewire components using Tailwind CSS utilities
         - Do NOT copy the raw HTML/CSS directly
         - Use Tailwind classes instead of inline styles
         - Follow the patterns in existing Blade components in resources/views/
         - Use Flux UI components where appropriate
      5. Add any necessary backend code (models, controllers, routes)
      6. Create a pull request with:
         - The translated Blade/Livewire components
         - Backend code
         - A screenshot reference in the PR body: ![Design](SCREENSHOT_URL)

      Use `gh` CLI for GitHub operations (creating PRs, posting comments).
    name: 'Stitch UI Implementer'
    filters:
      -
        field: event.label.name
        operator: equals
        value: stitch-design
    output:
      github_comment: true
      github_reaction: rocket
    agent:
      tools:
        - Read
        - Edit
        - Write
        - Bash
        - Glob
        - Grep
      isolation: true
